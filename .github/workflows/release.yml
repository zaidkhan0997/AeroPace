name: Build & Release AeroPace Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip dos2unix coreutils

      - name: Verify Line Endings and Permissions
        run: |
          chmod +x build.sh service.sh customize.sh
          chmod +x META-INF/com/google/android/update-binary
          dos2unix service.sh customize.sh module.prop system.prop update.json

      - name: Execute Module Packaging
        run: |
          ./build.sh

      - name: Extract Release Notes & Metadata
        id: meta
        run: |
          VERSION=$(grep -E '^version=' module.prop | cut -d'=' -f2 | tr -d '\r\n')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
          # Extract changelog section if available, otherwise generate default
          if [ -f "changelog.md" ]; then
            CHANGELOG_CONTENT=$(cat changelog.md)
          else
            CHANGELOG_CONTENT="Automated release for version ${VERSION}"
          fi
          
          # Save changelog for release body
          echo "$CHANGELOG_CONTENT" > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AeroPace Performance Engine ${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            out/AeroPace-*.zip
            out/AeroPace-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Release Announcement to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice ::Telegram secrets (TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID) are not configured. Skipping Telegram announcement."
            exit 0
          fi

          ZIP_FILE=$(ls out/AeroPace-*.zip 2>/dev/null | head -n 1)
          CAPTION=$(cat <<EOF
          ⚡ <b>AeroPace Performance Engine ${VERSION} Released!</b> ⚡

          A new official release is available with dynamic gaming optimizations.

          🔗 <b>Release Link:</b> https://github.com/${REPO}/releases/tag/${RELEASE_TAG}
          👥 <b>Support Group:</b> @AeroPace
          📢 <b>Channel:</b> @AeroPaceCH
          EOF
          )

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Uploading $ZIP_FILE to Telegram channel ${TELEGRAM_CHAT_ID}..."
            RESPONSE=$(curl -s -S -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"${ZIP_FILE}" \
              -F caption="${CAPTION}" \
              -F parse_mode="HTML")
          else
            echo "No flashable zip found in out/. Sending message without attachment..."
            RESPONSE=$(curl -s -S -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F text="${CAPTION}" \
              -F parse_mode="HTML")
          fi

          echo "Telegram API Response: $RESPONSE"
          if echo "$RESPONSE" | grep -Eq '"ok":[[:space:]]*true'; then
            echo "Telegram broadcast successful!"
          else
            echo "::warning ::Telegram broadcast failed. Check API response above."
          fi

