name: Build & Release AeroPace Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip dos2unix coreutils

      - name: Verify Line Endings and Permissions
        run: |
          chmod +x build.sh service.sh customize.sh
          chmod +x META-INF/com/google/android/update-binary
          dos2unix service.sh customize.sh module.prop system.prop update.json

      - name: Execute Module Packaging
        run: |
          ./build.sh

      - name: Extract Release Notes & Metadata
        id: meta
        run: |
          VERSION=$(grep -E '^version=' module.prop | cut -d'=' -f2 | tr -d '\r\n')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
          # Extract changelog section if available, otherwise generate default
          if [ -f "changelog.md" ]; then
            CHANGELOG_CONTENT=$(cat changelog.md)
          else
            CHANGELOG_CONTENT="Automated release for version ${VERSION}"
          fi
          
          # Save changelog for release body
          echo "$CHANGELOG_CONTENT" > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AeroPace Performance Engine ${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            out/AeroPace-*.zip
            out/AeroPace-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Release Announcement to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice ::Telegram secrets (TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID) are not configured. Skipping Telegram announcement."
            exit 0
          fi

          # 1. Configure 5 interactive button tabs (including Full Changelog)
          REPLY_MARKUP=$(printf "{\"inline_keyboard\":[[{\"text\":\"📦 GitHub Release\",\"url\":\"https://github.com/%s/releases/tag/%s\"},{\"text\":\"📖 Read README\",\"url\":\"https://github.com/%s#readme\"}],[{\"text\":\"📢 Channel\",\"url\":\"https://t.me/AeroPaceCH\"},{\"text\":\"👥 Support Group\",\"url\":\"https://t.me/AeroPace\"}],[{\"text\":\"📋 Full Changelog\",\"url\":\"https://github.com/%s/blob/%s/changelog.md\"}]]}" \
            "${REPO}" "${RELEASE_TAG}" "${REPO}" "${REPO}" "${RELEASE_TAG}")

          # 2. Extract changelog highlights
          CHANGELOG_HIGHLIGHTS=""
          if [ -f "changelog.md" ]; then
            CHANGELOG_HIGHLIGHTS=$(python3 -c "
          import sys, re, html
          version = sys.argv[1].lstrip('v')
          try:
              with open('changelog.md', 'r') as f:
                  content = f.read()
              pattern = rf'##\s+v?{re.escape(version)}[^\n]*\n(.*?)(?=\n##|\Z)'
              match = re.search(pattern, content, re.DOTALL | re.IGNORECASE)
              section = match.group(1).strip() if match else content.strip()
              lines = []
              for line in section.splitlines():
                  line = line.strip()
                  if not line or not line.startswith(('-', '*')):
                      continue
                  text = line.lstrip('-* \t')
                  if len(text) > 100:
                      text = text[:97].rsplit(' ', 1)[0] + '...'
                  lines.append('• ' + html.escape(text))
              result = []
              total_len = 0
              for line in lines:
                  if total_len + len(line) > 520 or len(result) >= 5:
                      result.append('• <i>...and more (tap Full Changelog below)</i>')
                      break
                  result.append(line)
                  total_len += len(line) + 1
              print('\n'.join(result))
          except Exception:
              pass
          " "${VERSION}")
          fi

          # 3. Assemble caption with warning note and highlights
          if [ -n "$CHANGELOG_HIGHLIGHTS" ]; then
            CAPTION=$(printf "%b\n" \
              "⚡ <b>AeroPace Performance Engine ${VERSION} Released!</b> ⚡\n" \
              "⚠️ <b>Important:</b> Please read <a href=\"https://github.com/${REPO}#readme\">README.md</a> before flashing!\n" \
              "📋 <b>Changelog Highlights:</b>" \
              "${CHANGELOG_HIGHLIGHTS}")
          else
            CAPTION=$(printf "%b\n" \
              "⚡ <b>AeroPace Performance Engine ${VERSION} Released!</b> ⚡\n" \
              "⚠️ <b>Important:</b> Please read <a href=\"https://github.com/${REPO}#readme\">README.md</a> before flashing!")
          fi

          # 4. Upload flashable zip with button tabs
          ZIP_FILE=$(ls out/AeroPace-*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Uploading $ZIP_FILE to Telegram channel ${TELEGRAM_CHAT_ID}..."
            RESPONSE=$(curl -s -S -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${ZIP_FILE}" \
              --form-string "caption=${CAPTION}" \
              --form-string "parse_mode=HTML" \
              --form-string "reply_markup=${REPLY_MARKUP}" || true)
          else
            echo "No flashable zip found in out/. Sending message without attachment..."
            RESPONSE=$(curl -s -S -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              --form-string "text=${CAPTION}" \
              --form-string "parse_mode=HTML" \
              --form-string "reply_markup=${REPLY_MARKUP}" || true)
          fi

          echo "Telegram API Response: $RESPONSE"
          if [[ "$RESPONSE" =~ \"ok\":[[:space:]]*true ]]; then
            echo "Telegram broadcast successful!"
          else
            echo "::warning ::Telegram broadcast failed. Check API response above."
          fi


